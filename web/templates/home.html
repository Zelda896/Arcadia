{{define "content"}}
<article class="intro">
{{if .About}}{{.About.HTML}}{{else}}<p>还没写。在 <code>content/pages/about.md</code> 里写上几句就行。</p>{{end}}
</article>

<hr>

{{range .Groups}}
<h2><a href="/c/{{.Name}}">{{.Name}}</a></h2>
<ul>
{{range .Posts}}
<li><a href="{{.URL}}">{{.Title}}</a> <span class="sub">— {{mmdd .Date}}</span></li>
{{end}}
</ul>
{{else}}
<p class="sub">还没有文章。</p>
{{end}}
{{end}}
