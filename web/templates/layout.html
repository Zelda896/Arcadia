{{define "layout"}}<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<link rel="stylesheet" href="/style.css">
<link rel="alternate" type="application/rss+xml" href="/feed.xml" title="{{.Site.Name}}">
</head>
<body>
<p><a class="brand" href="/">{{.Site.Name}}</a>{{if .Nav}}{{range .Nav}} · <a href="{{.URL}}">{{.Title}}</a>{{end}}{{end}}</p>
{{template "content" .}}
<hr>
<p class="sub">{{if .Site.Author}}{{.Year}} {{.Site.Author}} · {{end}}<a href="/feed.xml">RSS</a></p>
{{if .AdminJS}}<script src="/admin.js" defer></script>{{end}}
</body>
</html>
{{end}}
